<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Monitor — Radial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/monitor-chrome.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/monitor-tree.js"></script>
  <script src="/monitor-highlights.js"></script>
  <script src="/monitor-zoom.js"></script>
  <script src="/monitor-legend.js"></script>
  <script src="/monitor-preview.js"></script>
  <script src="/monitor-badges.js"></script>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #09090b; }
    body { display: flex; flex-direction: column; }
    .link { fill: none; stroke: #475569; stroke-opacity: 0.6; }
    .node circle { cursor: pointer; }
    .node text { font-size: 9px; font-family: ui-monospace, monospace; pointer-events: none; }
    .node .active-ring { fill: none; pointer-events: none; }
    #radial-chart {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      cursor: grab;
    }
    #radial-chart:active { cursor: grabbing; }
    #radial-chart-inner svg { display: block; }
  </style>
</head>
<body class="text-zinc-200">
  <header class="monitor-toolbar">
    <a href="/" class="toolbar-link text-zinc-500 hover:text-zinc-300 text-xs">
      <i class="fa-solid fa-table-columns fa-icon-sm" aria-hidden="true"></i>
      Dashboard
    </a>
    <span class="view-title">
      <i class="fa-solid fa-circle-nodes fa-icon" aria-hidden="true"></i>
      Radial
    </span>
    <span id="status-browser" class="monitor-badge monitor-badge--sm bg-zinc-800 text-zinc-400">Browser…</span>
    <span id="status-plugin" class="monitor-badge monitor-badge--sm bg-zinc-800 text-zinc-400">Plugin…</span>
    <span id="project-root-label" class="text-xs text-zinc-500 font-mono truncate max-w-md" title="">—</span>
    <span class="ml-auto flex flex-wrap items-center gap-2">
      <span id="action-legend"></span>
      <span id="radial-zoom-toolbar"></span>
    </span>
  </header>
  <div id="radial-chart"><div id="radial-chart-inner"></div></div>

  <script>
    const { setBadge } = MonitorBadges;
    const { cloneTree, createTreeApi } = MonitorTree;
    const { createHighlightStore, ACTION_COLORS } = MonitorHighlights;
    const { createZoomHost, attachZoomControls } = MonitorZoom;
    const { initLegend } = MonitorLegend;
    const { init: initPreview, open: openPreview } = MonitorPreview;
    const userCollapsed = new Set();
    const treeApi = createTreeApi(userCollapsed);
    const highlights = createHighlightStore();
    const zoomHost = createZoomHost({ scaleExtent: [0.15, 3] });

    let treeState = null;
    let indexSnapshot = null;
    let hasFullIndex = false;
    let monitorResetSeq = 0;
    let focusPath = null;
    let inProgressPath = null;
    let frameToActive = false;

    const ICON_DIR = "\u{1F4C1}";
    const ICON_FILE = "\u{1F4C4}";
    const WAITING_INDEX_MSG = "Waiting for project index from OpenCode plugin…";

    function notifyProjectInfo(data) {
      notifyParent("project-info", {
        projectRoot: data?.projectRoot || "",
        projectLabel: data?.projectLabel || data?.tree?.name || "",
      });
    }

    const UNTOUCHED = "#52525b";
    const VISITED_MUTED = "#71717a";

    function notifyParent(type, payload = {}) {
      try {
        window.parent?.postMessage(
          {
            source: "AICodeEditorMonitor",
            type,
            payload,
          },
          "*"
        );
      } catch {}
    }

    function nodeActiveAction(data) {
      return (
        highlights.getAction(data.path) ||
        (data.path === inProgressPath ? "write" : null) ||
        (data.action && data.visited ? data.action : null)
      );
    }

    function nodeFill(d) {
      const n = d.data;
      const active = nodeActiveAction(n);
      if (active && ACTION_COLORS[active]) return ACTION_COLORS[active];
      if (!n.visited) return UNTOUCHED;
      if (n.action && ACTION_COLORS[n.action]) return ACTION_COLORS[n.action];
      return VISITED_MUTED;
    }

    function frameRadial(radius, width, height, container) {
      const pad = 48;
      const cx = width / 2;
      const cy = height / 2;
      zoomHost.fitToContent(
        {
          x0: cx - radius - pad,
          y0: cy - radius - pad,
          x1: cx + radius + pad,
          y1: cy + radius + pad,
        },
        container.clientWidth || width,
        container.clientHeight || height
      );
    }

    function renderRadial(rootNode, opts = {}) {
      const container = document.getElementById("radial-chart");
      const inner = document.getElementById("radial-chart-inner");
      const preserveZoom =
        !!rootNode && opts.preserveZoom !== false && !opts.frameActive && !frameToActive;
      const animateEnter = opts.animateEnter === true;

      if (preserveZoom) {
        const existing = inner.querySelector("svg");
        if (existing) zoomHost.setTransform(d3.zoomTransform(existing));
      }

      inner.innerHTML = "";

      const width = container.clientWidth || 600;
      const height = container.clientHeight || 600;

      if (!rootNode) {
        d3.select(inner)
          .append("svg")
          .attr("width", width)
          .attr("height", height)
          .append("text")
          .attr("x", width / 2)
          .attr("y", height / 2)
          .attr("text-anchor", "middle")
          .attr("fill", "#71717a")
          .attr("font-size", 13)
          .text(WAITING_INDEX_MSG);
        return;
      }

      const radius = Math.min(width, height) / 2 - 40;

      const hierarchyFn = hasFullIndex
        ? (n) => treeApi.toHierarchyIndexed(n, focusPath)
        : (n) => treeApi.toHierarchy(n, focusPath);
      const root = d3.hierarchy(hierarchyFn(rootNode));
      d3.cluster().size([2 * Math.PI, radius]).separation((a, b) =>
        a.parent === b.parent ? 1 : 2 / a.depth
      )(root);

      const svg = d3
        .select("#radial-chart-inner")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

      const zoomLayer = svg.append("g").attr("class", "zoom-layer");
      const g = zoomLayer.append("g").attr("transform", `translate(${width / 2},${height / 2})`);

      g.append("g")
        .selectAll("path")
        .data(root.links())
        .join("path")
        .attr("class", "link")
        .attr(
          "d",
          d3
            .linkRadial()
            .angle((d) => d.x)
            .radius((d) => d.y)
        );

      const node = g
        .append("g")
        .selectAll("g")
        .data(root.descendants())
        .join("g")
        .attr(
          "transform",
          (d) => `rotate(${(d.x * 180) / Math.PI - 90}) translate(${d.y},0)`
        )
        .style("cursor", "pointer")
        .on("click", (event, d) => {
          event.stopPropagation();
          if (d.data.type === "dir") {
            const key = d.data.path;
            if (userCollapsed.has(key)) userCollapsed.delete(key);
            else userCollapsed.add(key);
            renderRadial(treeState, { preserveZoom: true, frameActive: false, animateEnter: true });
          } else if (d.data.path) {
            openPreview(d.data.path, d.data.name);
          }
        });

      node.each(function (d) {
        const sel = d3.select(this);
        const isDir = d.data.type === "dir";
        const activeAction = nodeActiveAction(d.data);
        const strokeColor = activeAction ? ACTION_COLORS[activeAction] || "#a78bfa" : null;
        const onLeft = d.x < Math.PI;

        if (strokeColor) {
          sel
            .append("ellipse")
            .attr("class", "active-ring")
            .attr("cx", onLeft ? 14 : -14)
            .attr("cy", 0)
            .attr("rx", isDir ? 42 : 36)
            .attr("ry", 10)
            .attr("stroke", strokeColor)
            .attr("stroke-width", 2);
        }

        sel
          .append("circle")
          .attr("r", (d) => (d.children ? 4 : 3))
          .attr("fill", nodeFill)
          .attr("stroke", strokeColor || "#09090b")
          .attr("stroke-width", strokeColor ? 1.5 : 0.5);

        const icon = isDir ? ICON_DIR : ICON_FILE;
        const chevron = isDir ? (d.children ? "\u25BE " : "\u25B8 ") : "";
        const name =
          d.data.name.length > 16 ? d.data.name.slice(0, 14) + "…" : d.data.name;

        sel
          .append("text")
          .attr("class", "node-icon")
          .attr("dy", "0.31em")
          .attr("x", onLeft ? 6 : -6)
          .attr("text-anchor", onLeft ? "start" : "end")
          .attr("transform", onLeft ? null : "rotate(180)")
          .attr("font-size", "10px")
          .text(icon);

        sel
          .append("text")
          .attr("class", "node-label")
          .attr("dy", "0.31em")
          .attr("x", onLeft ? 20 : -20)
          .attr("text-anchor", onLeft ? "start" : "end")
          .attr("transform", onLeft ? null : "rotate(180)")
          .attr("fill", d.data.visited ? "#e4e4e7" : "#a1a1aa")
          .attr("font-size", "9px")
          .attr("font-family", "ui-monospace, monospace")
          .text(isDir ? chevron + name : name);
      });

      if (animateEnter) {
        g.selectAll(".link")
          .attr("opacity", 0)
          .transition()
          .duration(180)
          .attr("opacity", 1);
        node
          .attr("opacity", 0)
          .transition()
          .duration(180)
          .attr("opacity", 1);
      }

      zoomHost.bind(svg, zoomLayer, container);

      if (opts.frameActive || frameToActive) {
        frameRadial(radius, width, height, container);
        frameToActive = false;
      } else if (preserveZoom) {
        svg.call(zoomHost.getBehavior().transform, zoomHost.getTransform());
      }
    }

    function syncHighlightsFromPayload(data) {
      if (data.activeFiles?.length) {
        for (const f of data.activeFiles) {
          if (f.path && f.action) highlights.stamp(f.path, f.action);
        }
      }
      if (data.tree) highlights.stampFromTree(data.tree);
    }

    function applyPayload(data) {
      if (data.type === "file_progress") {
        const p = MonitorHighlights.normPath(data.path);
        if (data.active) inProgressPath = p;
        else if (p === inProgressPath) inProgressPath = null;
        if (treeState) renderRadial(treeState);
        return;
      }

      if (data.type === "activity_event") {
        highlights.stamp(data.path, data.action);
        if (treeState) renderRadial(treeState);
        return;
      }

      if (data.type === "session_reset") {
        if (data.resetSeq != null) monitorResetSeq = data.resetSeq;
        focusPath = null;
        inProgressPath = null;
        highlights.clear();
        notifyParent("session-reset", { resetSeq: data.resetSeq });
        if (data.tree) treeState = cloneTree(data.tree);
        else if (indexSnapshot) treeState = cloneTree(indexSnapshot);
        hasFullIndex = !!indexSnapshot;
        if (treeState) renderRadial(treeState);
        return;
      }

      if (data.type === "project_index" && data.tree) {
        indexSnapshot = cloneTree(data.tree);
        treeState = cloneTree(data.tree);
        hasFullIndex = true;
        highlights.clear();
        frameToActive = true;
        notifyProjectInfo(data);
        renderRadial(treeState, { frameActive: true, preserveZoom: false });
        return;
      }

      if (data.projectRoot || data.projectLabel) {
        const el = document.getElementById("project-root-label");
        el.textContent = data.projectRoot || data.projectLabel;
        el.title = data.projectRoot || "";
        notifyProjectInfo(data);
      }

      if (data.activeFiles?.length) {
        focusPath = data.activeFiles[0].path;
        syncHighlightsFromPayload(data);
      }

      if (data.tree && data.type === "update") {
        if (data.resetSeq != null && data.resetSeq < monitorResetSeq) return;
        if (data.resetSeq != null) monitorResetSeq = data.resetSeq;
        if (!treeState && indexSnapshot) treeState = cloneTree(indexSnapshot);
        if (treeState) {
          treeApi.mergeActivityTree(treeState, data.tree);
          treeApi.expandVisitedAncestors(treeState);
        } else {
          treeState = cloneTree(data.tree);
        }
        syncHighlightsFromPayload(data);
        renderRadial(treeState);
      } else if (data.tree) {
        treeState = cloneTree(data.tree);
        syncHighlightsFromPayload(data);
        renderRadial(treeState);
      }
    }

    const ws = new WebSocket(`ws://${location.hostname}:8765`);
    ws.onopen = () => setBadge("status-browser", "Browser: connected", "ok");
    ws.onclose = () => setBadge("status-browser", "Browser: disconnected", "bad");
    ws.onerror = () => setBadge("status-browser", "Browser: error", "bad");
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "status") {
        if (data.status === "session_idle") {
          notifyParent("prompt-complete", {
            summary: data.summary ?? null,
          });
        }
        if (data.status === "plugin_connected") setBadge("status-plugin", "Plugin: connected", "ok");
        if (data.status === "plugin_waiting") setBadge("status-plugin", "Plugin: no server", "warn");
        return;
      }
      applyPayload(data);
    };

    initLegend(document.getElementById("action-legend"));
    attachZoomControls(document.getElementById("radial-zoom-toolbar"), zoomHost, {
      hint: "Scroll/zoom · click folders to collapse",
    });
    initPreview();

    renderRadial(null);

    let resizeTimer;
    new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderRadial(treeState, { preserveZoom: true, frameActive: false });
      }, 80);
    }).observe(document.getElementById("radial-chart"));
  </script>
</body>
</html>
