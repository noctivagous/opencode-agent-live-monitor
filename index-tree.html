<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Monitor — Tree</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/monitor-chrome.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/monitor-tree.js"></script>
  <script src="/monitor-highlights.js"></script>
  <script src="/monitor-zoom.js"></script>
  <script src="/monitor-legend.js"></script>
  <script src="/monitor-preview.js"></script>
  <script src="/monitor-badges.js"></script>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #09090b; }
    body { display: flex; flex-direction: column; }
    .node { cursor: pointer; }
    .node text { font-size: 11px; font-family: ui-monospace, monospace; pointer-events: auto; }
    .node .dir-capsule { stroke-width: 1.25; }
    .node .active-capsule { fill: none; stroke-width: 2; pointer-events: none; }
    .link { fill: none; stroke: #475569; stroke-width: 1.5px; }
    #tree-chart {
      flex: 1;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      cursor: grab;
    }
    #tree-chart:active { cursor: grabbing; }
    #tree-chart-inner svg { display: block; }
  </style>
</head>
<body class="text-zinc-200">
  <header class="monitor-toolbar">
    <a href="/" class="toolbar-link text-zinc-500 hover:text-zinc-300 text-xs">
      <i class="fa-solid fa-table-columns fa-icon-sm" aria-hidden="true"></i>
      Dashboard
    </a>
    <span class="view-title">
      <i class="fa-solid fa-sitemap fa-icon" aria-hidden="true"></i>
      Tree
    </span>
    <span id="status-browser" class="monitor-badge monitor-badge--sm bg-zinc-800 text-zinc-400">Browser…</span>
    <span id="status-plugin" class="monitor-badge monitor-badge--sm bg-zinc-800 text-zinc-400">Plugin…</span>
    <span id="project-root-label" class="text-xs text-zinc-500 font-mono truncate max-w-md" title="">—</span>
    <span class="ml-auto flex flex-wrap items-center gap-2">
      <span id="action-legend"></span>
      <span id="tree-zoom-toolbar"></span>
    </span>
  </header>
  <div id="tree-chart"><div id="tree-chart-inner"></div></div>

  <script>
    const { setBadge } = MonitorBadges;
    const { cloneTree, createTreeApi } = MonitorTree;
    const { createHighlightStore, ACTION_COLORS } = MonitorHighlights;
    const { createZoomHost, attachZoomControls } = MonitorZoom;
    const { initLegend } = MonitorLegend;
    const { init: initPreview, open: openPreview } = MonitorPreview;
    const userCollapsed = new Set();
    const treeApi = createTreeApi(userCollapsed);
    const highlights = createHighlightStore();
    const zoomHost = createZoomHost({ scaleExtent: [0.15, 3] });

    let treeState = null;
    let indexSnapshot = null;
    let hasFullIndex = false;
    let monitorResetSeq = 0;
    let focusPath = null;
    let inProgressPath = null;
    let frameToActive = false;
    let hasInitialFramed = false;

    const ICON_DIR = "\u{1F4C1}";
    const ICON_FILE = "\u{1F4C4}";
    const WAITING_INDEX_MSG = "Waiting for project index from OpenCode plugin…";

    function notifyProjectInfo(data) {
      notifyParent("project-info", {
        projectRoot: data?.projectRoot || "",
        projectLabel: data?.projectLabel || data?.tree?.name || "",
      });
    }

    function notifyParent(type, payload = {}) {
      try {
        window.parent?.postMessage(
          {
            source: "AICodeEditorMonitor",
            type,
            payload,
          },
          "*"
        );
      } catch {}
    }

    function nodeActiveAction(data) {
      return (
        highlights.getAction(data.path) ||
        (data.path === inProgressPath ? "write" : null) ||
        (data.action && data.visited ? data.action : null)
      );
    }

    function appendActiveCapsule(sel, isDir, label, labelX, estLabelW) {
      const capH = isDir ? 18 : 16;
      const capW = estLabelW + 14;
      sel
        .insert("rect", ":first-child")
        .attr("class", "active-capsule")
        .attr("x", labelX - 8)
        .attr("y", -capH / 2)
        .attr("width", capW)
        .attr("height", capH)
        .attr("rx", capH / 2);
    }

    function frameActiveNodes(descendants, container) {
      let targets = descendants.filter((d) => nodeActiveAction(d.data) || d.data.isFocus);
      if (!targets.length) targets = descendants;
      if (!targets.length || !zoomHost.getBehavior()) return;

      const padX = 80;
      const padY = 40;
      const ox = 16;
      const oy = 16;
      zoomHost.fitToContent(
        {
          x0: d3.min(targets, (d) => d.y) + ox - padX,
          x1: d3.max(targets, (d) => d.y) + ox + padX + 100,
          y0: d3.min(targets, (d) => d.x) + oy - padY,
          y1: d3.max(targets, (d) => d.x) + oy + padY,
        },
        container.clientWidth || 400,
        container.clientHeight || 400
      );
    }

    function renderTree(rootNode, opts = {}) {
      const container = document.getElementById("tree-chart");
      const inner = document.getElementById("tree-chart-inner");
      const preserveZoom =
        !!rootNode && opts.preserveZoom !== false && !opts.frameActive && !frameToActive;
      const animateEnter = opts.animateEnter === true;

      if (preserveZoom) {
        const existing = inner.querySelector("svg");
        if (existing) zoomHost.setTransform(d3.zoomTransform(existing));
      }

      inner.innerHTML = "";

      if (!rootNode) {
        const cw = Math.max(320, container.clientWidth || 320);
        const ch = Math.max(200, container.clientHeight || 200);
        d3.select(inner)
          .append("svg")
          .attr("width", cw)
          .attr("height", ch)
          .append("text")
          .attr("x", cw / 2)
          .attr("y", ch / 2)
          .attr("text-anchor", "middle")
          .attr("fill", "#71717a")
          .attr("font-size", 13)
          .text(WAITING_INDEX_MSG);
        return;
      }

      const hierarchyFn = hasFullIndex
        ? (n) => treeApi.toHierarchyIndexed(n, focusPath)
        : (n) => treeApi.toHierarchy(n, focusPath);
      const hierarchy = d3.hierarchy(hierarchyFn(rootNode));
      const descendants = hierarchy.descendants();
      const visible = descendants.length;

      const maxDepth = d3.max(descendants, (d) => d.depth) || 0;
      const cw = Math.max(320, container.clientWidth || 320);
      const ch = Math.max(200, container.clientHeight || 200);
      const width = Math.max(cw * 2, maxDepth * 220 + 280);
      const height = Math.max(ch * 2, visible * 26 + 80);

      const svg = d3.select("#tree-chart-inner").append("svg").attr("width", width).attr("height", height);
      const zoomLayer = svg.append("g");
      const g = zoomLayer.append("g").attr("transform", "translate(16,16)");
      d3.tree().size([height - 32, width - 32])(hierarchy);

      g.selectAll(".link")
        .data(hierarchy.links())
        .enter()
        .append("path")
        .attr("class", "link")
        .attr("d", d3.linkHorizontal().x((d) => d.y).y((d) => d.x));

      const node = g
        .selectAll(".node")
        .data(descendants)
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", (d) => `translate(${d.y},${d.x})`)
        .on("click", (event, d) => {
          event.stopPropagation();
          if (d.data.type === "dir") {
            const key = d.data.path;
            if (userCollapsed.has(key)) userCollapsed.delete(key);
            else userCollapsed.add(key);
            renderTree(treeState, { preserveZoom: true, frameActive: false, animateEnter: true });
          } else if (d.data.path) {
            openPreview(d.data.path, d.data.name);
          }
        })
        .style("cursor", "pointer");

      node.each(function (d) {
        const sel = d3.select(this);
        const isDir = d.data.type === "dir";
        const icon = isDir ? ICON_DIR : ICON_FILE;
        const chevron = isDir ? (d.children ? "\u25BE " : "\u25B8 ") : "";
        const label = chevron + d.data.name;
        const activeAction = nodeActiveAction(d.data);
        const strokeColor = activeAction ? ACTION_COLORS[activeAction] || "#a78bfa" : null;
        const labelFill = d.data.isFocus
          ? "#86efac"
          : !d.data.visited
            ? "#94a3b8"
            : "#e2e8f0";
        const labelX = 20;
        const iconX = 2;
        const estLabelW = Math.max(40, label.length * 6.2);

        if (strokeColor) {
          appendActiveCapsule(sel, isDir, label, labelX, estLabelW);
          sel.select(".active-capsule").attr("stroke", strokeColor);
        }

        sel
          .append("text")
          .attr("x", iconX)
          .attr("dy", "0.32em")
          .attr("font-size", "12px")
          .text(icon);

        if (isDir) {
          const capH = 18;
          const capW = estLabelW + 12;
          sel
            .append("rect")
            .attr("class", "dir-capsule")
            .attr("x", labelX - 6)
            .attr("y", -capH / 2)
            .attr("width", capW)
            .attr("height", capH)
            .attr("rx", capH / 2)
            .attr("fill", d.data.visited ? "#312e81" : "#27272a")
            .attr("stroke", strokeColor || "#4f46e5");
          sel
            .append("text")
            .attr("x", labelX)
            .attr("dy", "0.32em")
            .text(label)
            .style("fill", labelFill);
        } else {
          if (d.data.isFocus) {
            sel
              .append("circle")
              .attr("r", 4)
              .attr("cx", labelX - 4)
              .attr("cy", 0)
              .attr("fill", "#22c55e")
              .attr("opacity", 0.9);
          }
          sel
            .append("text")
            .attr("x", labelX)
            .attr("dy", "0.32em")
            .text(d.data.name)
            .style("fill", labelFill);
        }
      });

      if (animateEnter) {
        g.selectAll(".link")
          .attr("opacity", 0)
          .transition()
          .duration(180)
          .attr("opacity", 1);
        node
          .attr("opacity", 0)
          .transition()
          .duration(180)
          .attr("opacity", 1);
      }

      zoomHost.bind(svg, zoomLayer, container);

      if (opts.frameActive || frameToActive) {
        frameActiveNodes(descendants, container);
        frameToActive = false;
        hasInitialFramed = true;
      } else if (preserveZoom) {
        svg.call(zoomHost.getBehavior().transform, zoomHost.getTransform());
      }
    }

    function syncHighlightsFromPayload(data) {
      if (data.activeFiles?.length) {
        for (const f of data.activeFiles) {
          if (f.path && f.action) highlights.stamp(f.path, f.action);
        }
      }
      if (data.tree) highlights.stampFromTree(data.tree);
    }

    function applyNewPromptReset(data) {
      if (data.resetSeq != null && data.resetSeq < monitorResetSeq) return;
      if (data.resetSeq != null) monitorResetSeq = data.resetSeq;
      focusPath = null;
      inProgressPath = null;
      highlights.clear();
      if (data.tree) treeState = cloneTree(data.tree);
      else if (indexSnapshot) treeState = cloneTree(indexSnapshot);
      hasFullIndex = !!indexSnapshot;
      frameToActive = false;
      if (treeState) renderTree(treeState);
    }

    function applyPayload(data) {
      if (data.type === "agent_status" && data.phase === "prompt_submitted") {
        applyNewPromptReset(data);
        return;
      }

      if (data.type === "file_progress") {
        if (data.resetSeq != null && data.resetSeq < monitorResetSeq) return;
        if (data.resetSeq != null) monitorResetSeq = Math.max(monitorResetSeq, data.resetSeq);
        const p = MonitorHighlights.normPath(data.path);
        if (data.active) inProgressPath = p;
        else if (p === inProgressPath) inProgressPath = null;
        frameToActive = true;
        if (treeState) renderTree(treeState);
        return;
      }

      if (data.type === "activity_event") {
        if (data.resetSeq != null && data.resetSeq < monitorResetSeq) return;
        if (data.resetSeq != null) monitorResetSeq = Math.max(monitorResetSeq, data.resetSeq);
        highlights.stamp(data.path, data.action);
        frameToActive = true;
        if (treeState) renderTree(treeState);
        return;
      }

      if (data.type === "session_reset") {
        notifyParent("session-reset", { resetSeq: data.resetSeq });
        applyNewPromptReset(data);
        return;
      }

      if (data.type === "project_index" && data.tree) {
        indexSnapshot = cloneTree(data.tree);
        treeState = cloneTree(data.tree);
        hasFullIndex = true;
        highlights.clear();
        frameToActive = true;
        notifyProjectInfo(data);
        renderTree(treeState, { frameActive: true, preserveZoom: false });
        return;
      }

      if (data.projectRoot || data.projectLabel) {
        const el = document.getElementById("project-root-label");
        el.textContent = data.projectRoot || data.projectLabel;
        el.title = data.projectRoot || "";
        notifyProjectInfo(data);
      }

      if (data.activeFiles?.length) {
        focusPath = data.activeFiles[0].path;
        syncHighlightsFromPayload(data);
      } else if (data.type === "update" && Array.isArray(data.activeFiles) && !data.activeFiles.length) {
        focusPath = null;
      }

      if (data.tree && data.type === "update") {
        if (data.resetSeq != null && data.resetSeq < monitorResetSeq) return;
        if (data.resetSeq != null) monitorResetSeq = data.resetSeq;
        if (!treeState && indexSnapshot) treeState = cloneTree(indexSnapshot);
        if (treeState) {
          treeApi.mergeActivityTree(treeState, data.tree);
          treeApi.expandVisitedAncestors(treeState);
        } else {
          treeState = cloneTree(data.tree);
        }
        syncHighlightsFromPayload(data);
        frameToActive = true;
        renderTree(treeState);
      } else if (data.tree) {
        if (!hasInitialFramed) frameToActive = true;
        treeState = cloneTree(data.tree);
        syncHighlightsFromPayload(data);
        renderTree(treeState, { frameActive: frameToActive, preserveZoom: !frameToActive });
      }
    }

    const ws = new WebSocket(`ws://${location.hostname}:8765`);
    ws.onopen = () => setBadge("status-browser", "Browser: connected", "ok");
    ws.onclose = () => setBadge("status-browser", "Browser: disconnected", "bad");
    ws.onerror = () => setBadge("status-browser", "Browser: error", "bad");
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "status") {
        if (data.status === "session_idle") {
          notifyParent("prompt-complete", {
            summary: data.summary ?? null,
          });
        }
        if (data.status === "plugin_connected") setBadge("status-plugin", "Plugin: connected", "ok");
        if (data.status === "plugin_waiting") setBadge("status-plugin", "Plugin: no server", "warn");
        return;
      }
      applyPayload(data);
    };

    initLegend(document.getElementById("action-legend"));
    attachZoomControls(document.getElementById("tree-zoom-toolbar"), zoomHost, {
      hint: "Scroll/zoom · click folders to collapse",
    });
    initPreview();

    renderTree(null);

    let resizeTimer;
    new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderTree(treeState, { preserveZoom: true, frameActive: false });
      }, 80);
    }).observe(document.getElementById("tree-chart"));
  </script>
</body>
</html>
