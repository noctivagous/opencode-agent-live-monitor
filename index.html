<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Live Monitor — Activity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/monitor-chrome.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      background: #09090b;
    }
    .file-card { transition: box-shadow 0.2s, border-color 0.2s; }
    .file-card.is-focus { box-shadow: 0 0 0 2px #22c55e66; }
    .pulse-once { animation: pulseOnce 0.6s ease-out; }
    @keyframes pulseOnce { 0% { background: #3b82f633; } 100% { background: transparent; } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
  <header class="monitor-toolbar">
    <a href="/" class="toolbar-link text-zinc-500 hover:text-zinc-300 text-xs">
      <i class="fa-solid fa-table-columns fa-icon-sm" aria-hidden="true"></i>
      Dashboard
    </a>
    <span class="view-title">
      <i class="fa-solid fa-list-check fa-icon" aria-hidden="true"></i>
      Activity
    </span>
    <span id="project-root-label" class="text-xs text-zinc-500 font-mono truncate max-w-xs" title="">—</span>
    <span id="status-browser" data-badge-ring="true" class="monitor-badge monitor-badge--sm bg-zinc-800 text-zinc-400">Browser: connecting…</span>
    <span id="status-plugin" data-badge-ring="true" class="monitor-badge monitor-badge--sm bg-zinc-800 text-zinc-400">Plugin: waiting…</span>
    <span id="status-agent" data-badge-ring="true" class="monitor-badge bg-zinc-800 text-zinc-400 max-w-md truncate" title="">Agent: idle</span>
    <span id="status-last" class="ml-auto text-xs text-zinc-500 inline-flex items-center gap-1.5">
      <i class="fa-solid fa-clock fa-icon-sm" aria-hidden="true"></i>
      Last update: —
    </span>
  </header>

  <div class="flex-1 min-h-0 grid grid-cols-12 gap-4 p-4 overflow-hidden">
    <div class="col-span-7 bg-zinc-950 border border-zinc-800 rounded-xl p-4 flex flex-col min-h-0 min-w-0">
      <h2 class="font-semibold mb-1 section-title">
        <i class="fa-solid fa-file-lines fa-icon" aria-hidden="true"></i>
        Active Files
      </h2>
      <p class="text-xs text-zinc-500 mb-4">Recent paths grouped by folder — what the agent is looking at</p>
      <div id="stage" class="flex-1 overflow-auto min-h-0">
        <p class="text-zinc-600 text-sm text-center mt-12">No files yet. Ask the agent to explore the project.</p>
      </div>
    </div>

    <div class="col-span-5 bg-zinc-900 rounded-xl p-4 border border-zinc-800 flex flex-col min-h-0 min-w-0">
      <h2 class="font-semibold mb-4 section-title">
        <i class="fa-solid fa-scroll fa-icon" aria-hidden="true"></i>
        Agent Activity
      </h2>
      <div id="log" class="flex-1 overflow-auto space-y-2 text-sm min-h-0"></div>
    </div>
  </div>

  <script src="/monitor-badges.js"></script>
  <script>
    const { setBadge } = MonitorBadges;
    let focusPath = null;
    let activeFilesList = [];

    const ACTION_STYLES = {
      read: { badge: 'bg-blue-950 text-blue-300 ring-blue-800', label: 'Read' },
      edit: { badge: 'bg-emerald-950 text-emerald-300 ring-emerald-800', label: 'Edited' },
      list: { badge: 'bg-violet-950 text-violet-300 ring-violet-800', label: 'Listed' },
      glob: { badge: 'bg-violet-950 text-violet-300 ring-violet-800', label: 'Glob' },
      grep: { badge: 'bg-violet-950 text-violet-300 ring-violet-800', label: 'Grep' },
    };

    function formatActiveTime(at) {
      if (at == null) return "";
      return new Date(at).toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      });
    }

    function renderActiveFiles(files) {
      const stage = document.getElementById('stage');
      if (!files?.length) {
        stage.innerHTML = '<p class="text-zinc-600 text-sm text-center mt-12">No files yet. Ask the agent to explore the project.</p>';
        return;
      }

      const byDir = new Map();
      for (const f of files) {
        const key = f.dir === '.' ? '' : f.dir;
        if (!byDir.has(key)) byDir.set(key, []);
        byDir.get(key).push(f);
      }

      const sections = [...byDir.entries()].map(([dir, items]) => {
        const dirTitle = dir || '(project root)';
        const cards = items.map((f, i) => {
          const style = ACTION_STYLES[f.action] || { badge: 'bg-zinc-800 text-zinc-300 ring-zinc-700', label: f.action };
          const focus = i === 0 && f.path === focusPath;
          const timeLabel = formatActiveTime(f.at);
          return `
            <div class="file-card rounded-xl border border-zinc-700 bg-zinc-900 p-4 ${focus ? 'is-focus pulse-once' : ''}">
              <div class="flex items-start justify-between gap-2">
                <span class="text-lg text-zinc-400"><i class="${f.name.includes('.') ? 'fa-solid fa-file' : 'fa-solid fa-file-lines'}" aria-hidden="true"></i></span>
                <div class="flex flex-col items-end gap-1 shrink-0">
                  <span class="text-[10px] uppercase tracking-wide rounded px-2 py-0.5 ring-1 ${style.badge}">${style.label}</span>
                  ${timeLabel ? `<span class="text-[10px] text-zinc-500 font-mono tabular-nums">${timeLabel}</span>` : ""}
                </div>
              </div>
              <div class="mt-2 font-semibold text-sm truncate" title="${f.path}">${f.name}</div>
              <div class="text-[11px] text-zinc-500 font-mono mt-1 truncate">${f.path}</div>
            </div>`;
        }).join('');

        return `
          <section class="mb-6">
            <h3 class="text-xs font-semibold text-violet-300/90 mb-2 font-mono flex items-center gap-2">
              <i class="fa-solid fa-folder fa-icon-sm" aria-hidden="true"></i> ${dirTitle}
            </h3>
            <div class="grid grid-cols-2 xl:grid-cols-3 gap-3">${cards}</div>
          </section>`;
      }).join('');

      stage.innerHTML = sections;
    }

    function touchLastUpdate() {
      const t = new Date().toLocaleTimeString();
      document.getElementById('status-last').innerHTML =
        `<i class="fa-solid fa-clock fa-icon-sm" aria-hidden="true"></i> Last update: ${t}`;
    }

    function logEntryIconHtml(entry) {
      const cls = /Opened folder|folder/i.test(entry)
        ? 'fa-solid fa-folder'
        : 'fa-solid fa-file';
      return `<i class="${cls} fa-icon-sm text-zinc-400" aria-hidden="true"></i>`;
    }

    function appendLog(entry) {
      const logEl = document.getElementById('log');
      const div = document.createElement('div');
      div.className = 'bg-zinc-800/80 p-2.5 rounded-lg text-xs flex items-start gap-2';
      const iconEl = document.createElement('span');
      iconEl.className = 'text-sm leading-none shrink-0 mt-0.5';
      iconEl.setAttribute('aria-hidden', 'true');
      iconEl.innerHTML = logEntryIconHtml(entry);
      const body = document.createElement('span');
      body.className = 'flex-1 min-w-0 leading-relaxed';
      body.innerHTML = entry;
      div.appendChild(iconEl);
      div.appendChild(body);
      logEl.appendChild(div);
      while (logEl.children.length > 80) logEl.removeChild(logEl.firstChild);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function notifyParent(type, payload = {}) {
      try {
        window.parent?.postMessage(
          {
            source: 'AICodeEditorMonitor',
            type,
            payload,
          },
          '*'
        );
      } catch {}
    }

    function applySessionReset() {
      focusPath = null;
      activeFilesList = [];
      renderActiveFiles([]);
      const logEl = document.getElementById('log');
      if (logEl) logEl.innerHTML = '';
      appendLog('<span class="text-zinc-500">Activity view reset — waiting for agent activity</span>');
    }

    function applyAgentStatus(data) {
      const el = document.getElementById('status-agent');
      const phase = data.phase || 'unknown';
      const msg = data.message || phase;
      const tones = {
        working: 'bg-amber-950 text-amber-200 ring-1 ring-amber-800',
        prompt_submitted: 'bg-violet-950 text-violet-200 ring-1 ring-violet-800',
        complete: 'bg-sky-950 text-sky-200 ring-1 ring-sky-800',
        idle: 'bg-sky-950 text-sky-200 ring-1 ring-sky-800',
      };
      const label =
        phase === 'complete' || phase === 'idle'
          ? `Agent: done${data.summary ? ' — ' + data.summary : ''}`
          : phase === 'prompt_submitted'
            ? `Agent: running${data.prompt ? ' — ' + data.prompt : ''}`
            : `Agent: ${msg}`;
      const short = label.length > 120 ? label.slice(0, 117) + '…' : label;
      el.title = data.summary || data.prompt || msg;
      el.className = `monitor-badge inline-flex items-center gap-1.5 max-w-md truncate ${tones[phase] || tones.working}`;
      el.innerHTML = `<i class="fa-solid fa-robot fa-icon-sm" aria-hidden="true"></i> ${short}`;

      if (phase === 'prompt_submitted') {
        notifyParent('prompt-submitted', { prompt: data.prompt, resetSeq: data.resetSeq });
      }

      if (phase === 'complete' || phase === 'idle') {
        if (data.summary) {
          appendLog(`<strong class="text-sky-400">Summary</strong> <span class="text-zinc-300">${data.summary}</span>`);
        } else {
          appendLog('<span class="text-slate-500">Prompt complete — agent idle</span>');
        }
      }
    }

    function applyPayload(data) {
      if (data.type === 'agent_status') {
        applyAgentStatus(data);
        if (data.phase === 'prompt_submitted') applySessionReset();
        return;
      }

      if (data.type === 'session_reset') {
        applySessionReset();
        return;
      }

      if (data.projectRoot || data.projectLabel) {
        const el = document.getElementById('project-root-label');
        el.textContent = data.projectRoot || data.projectLabel;
        el.title = data.projectRoot || '';
        notifyParent('project-info', {
          projectRoot: data.projectRoot || '',
          projectLabel: data.projectLabel || '',
        });
      }

      if (data.type === 'project_index' && data.tree) {
        notifyParent('project-info', {
          projectRoot: data.projectRoot || '',
          projectLabel: data.projectLabel || data.tree?.name || '',
        });
      }

      if (data.activeFiles?.length) {
        focusPath = data.activeFiles[0].path;
        activeFilesList = data.activeFiles;
      } else if (data.type === 'update' && Array.isArray(data.activeFiles) && data.activeFiles.length === 0) {
        activeFilesList = [];
        focusPath = null;
      }

      if (data.activeFiles !== undefined) {
        renderActiveFiles(activeFilesList);
      }

      if (data.log) appendLog(data.log);
    }

    const ws = new WebSocket('ws://localhost:8765');

    ws.onopen = () => {
      setBadge('status-browser', 'Browser: connected', 'ok');
      appendLog('<span class="text-zinc-500">Dashboard connected — waiting for OpenCode plugin…</span>');
    };

    ws.onclose = () => setBadge('status-browser', 'Browser: disconnected', 'bad');
    ws.onerror = () => setBadge('status-browser', 'Browser: error', 'bad');

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      touchLastUpdate();

      if (data.type === 'status') {
        if (data.status === 'plugin_connected') setBadge('status-plugin', 'Plugin: connected', 'ok');
        else if (data.status === 'plugin_waiting') setBadge('status-plugin', 'Plugin: no server', 'warn');
        else if (data.status === 'session_idle') {
          setBadge('status-plugin', 'Plugin: connected (idle)', 'ok');
          applyAgentStatus({
            phase: 'complete',
            message: 'Prompt complete',
            summary: data.summary,
          });
          notifyParent('prompt-complete', {
            summary: data.summary ?? null,
            message: data.summary ? `Done — ${data.summary}` : 'Prompt complete',
          });
        }
      } else {
        applyPayload(data);
      }
    };
  </script>
</body>
</html>
