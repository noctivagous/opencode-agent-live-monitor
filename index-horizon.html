<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Monitor — Horizon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/monitor-chrome.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/monitor-zoom.js"></script>
  <script src="/monitor-preview.js"></script>
  <script src="/monitor-badges.js"></script>
  <script src="/monitor-legend.js"></script>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #09090b; }
    body { display: flex; flex-direction: column; }
    #horizon-viewport {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      cursor: default;
    }
    #horizon-chart-inner { width: 100%; height: 100%; }
    #horizon-chart-inner svg { display: block; max-width: 100%; }
    #horizon-viewport.is-panning { cursor: grab; }
    #horizon-viewport.is-panning:active { cursor: grabbing; }
    .horizon-hscroll .track { cursor: pointer; }
    .horizon-hscroll .thumb { cursor: grab; fill: #52525b; }
    .horizon-hscroll .thumb:active { cursor: grabbing; fill: #71717a; }
    .dir-label { fill: #a78bfa; font-weight: 600; }
    .file-label { fill: #a1a1aa; }
    .file-row-hit { fill: transparent; cursor: pointer; pointer-events: all; }
    .file-row-hit:hover { fill: rgba(255, 255, 255, 0.04); }
    .axis text { fill: #71717a; font-size: 17px; }
    .axis line, .axis path { stroke: #3f3f46; }
    .prompt-marker { pointer-events: none; }
    .prompt-marker-label {
      font-size: 11px;
      font-family: ui-monospace, monospace;
      font-weight: 600;
      pointer-events: none;
    }
    .placeholder-dir { fill: #52525b; font-weight: 600; }
    .placeholder-file { fill: #3f3f46; }
    .placeholder-hint { fill: #71717a; font-size: 13px; }
  </style>
</head>
<body class="text-zinc-200">
  <header class="monitor-toolbar">
    <a href="/" class="toolbar-link text-zinc-500 hover:text-zinc-300 text-xs">
      <i class="fa-solid fa-table-columns fa-icon-sm" aria-hidden="true"></i>
      Dashboard
    </a>
    <span class="view-title">
      <i class="fa-solid fa-chart-area fa-icon" aria-hidden="true"></i>
      Horizon
    </span>
    <span id="status-browser" class="monitor-badge monitor-badge--sm bg-zinc-800 text-zinc-400">Browser…</span>
    <span id="status-plugin" class="monitor-badge monitor-badge--sm bg-zinc-800 text-zinc-400">Plugin…</span>
    <span id="status-prompt" class="text-xs text-zinc-500 truncate max-w-[14rem]">Waiting for prompt…</span>
    <span id="status-stats" class="text-xs text-zinc-500">—</span>
    <span class="ml-auto flex flex-wrap items-center gap-2">
      <label
        class="monitor-timeline-scale inline-flex items-center gap-1.5 text-xs text-zinc-500"
        title="Timeline horizontal scale (saved on server)"
      >
        <i class="fa-solid fa-sliders fa-icon-sm" aria-hidden="true"></i>
        <input
          type="range"
          id="horizon-timeline-scale"
          min="0.25"
          max="4"
          step="0.05"
          value="1"
        />
      </label>
      <span id="horizon-zoom-toolbar"></span>
    </span>
  </header>
  <div id="horizon-viewport">
    <div id="horizon-chart-inner"></div>
  </div>

  <script>
    const { setBadge } = MonitorBadges;
    const SCALE = 1.44;
    const BUCKET_MS = 1000;
    const MAX_FILES = 80;
    const MIN_PROMPT_SPAN_MS = 8000;
    const BASE_TIMELINE_PX = 1200;
    const MIN_CHART_W = 400;
    const SCROLLBAR_H = Math.round(12 * SCALE);
    const CLIP_ID = "horizon-plot-clip";
    const GUTTER = Math.round(200 * SCALE);
    const ROW_H = Math.round(22 * SCALE);
    const DIR_ROW_H = Math.round(18 * SCALE);
    const MARGIN_TOP = Math.round(28 * SCALE);
    const MARGIN_RIGHT = Math.round(16 * SCALE);

    /** Skeleton rows shown while waiting for a prompt. */
    const PLACEHOLDER_ROWS = [
      { type: "dir", label: "src/" },
      { type: "file", label: "index.ts" },
      { type: "file", label: "app.ts" },
      { type: "dir", label: "lib/" },
      { type: "file", label: "utils.ts" },
      { type: "dir", label: "tests/" },
      { type: "file", label: "app.test.ts" },
    ];

    const ACTION_COLORS = {
      read: "#2563eb",
      edit: "#16a34a",
      list: "#7c3aed",
      glob: "#9333ea",
      grep: "#a855f7",
      write: "#ca8a04",
      bash: "#ca8a04",
    };

    const events = [];
    const fileMeta = new Map();
    const { createZoomHost, attachZoomControls } = MonitorZoom;
    const { init: initPreview, open: openPreview } = MonitorPreview;
    const zoomHost = createZoomHost({ scaleExtent: [0.25, 3] });
    let timelineScale = 1;
    let horizonViewReady = false;
    let monitorResetSeq = 0;
    let saveTimelineTimer = null;
    let followLiveEdge = true;
    let timelineScrollX = 0;
    let currentLayout = null;
    const SCROLL_EDGE_EPS = 8;

    /** idle | running | frozen */
    let promptPhase = "idle";
    let promptStartAt = null;
    let promptEndAt = null;
    // Plugin debounces session.idle between agent-loop iterations; brief local grace only.
    const UNFREEZE_GRACE_MS = 150;
    let lastActivityAt = null;

    function chartTimelineWidth() {
      return Math.max(MIN_CHART_W, Math.round(BASE_TIMELINE_PX * timelineScale));
    }

    function plotWidth(cw) {
      return Math.max(1, cw - GUTTER - MARGIN_RIGHT);
    }

    function computeLayout(viewport, rows, t0, t1) {
      const cw = viewport.clientWidth || 800;
      const ch = viewport.clientHeight || 400;
      const chartW = chartTimelineWidth();
      const plotW = plotWidth(cw);
      const scrollMax = Math.max(0, chartW - plotW);
      timelineScrollX = Math.min(timelineScrollX, scrollMax);
      const totalH =
        MARGIN_TOP +
        rows.reduce((s, r) => s + (r.type === "dir" ? DIR_ROW_H : ROW_H), 0) +
        Math.round(16 * SCALE);
      const chartBottom = Math.max(MARGIN_TOP + 40, totalH);
      const svgH = Math.max(ch, chartBottom + SCROLLBAR_H + Math.round(10 * SCALE));
      const x = d3.scaleTime().domain([t0, t1]).range([GUTTER, GUTTER + chartW]);
      return {
        cw,
        ch,
        chartW,
        plotW,
        scrollMax,
        totalH,
        chartBottom,
        svgH,
        x,
        t0,
        t1,
      };
    }

    function applyTimelineScrollPan() {
      d3.select("#horizon-chart-inner .horizon-scroll-pan").attr(
        "transform",
        `translate(${-timelineScrollX},0)`
      );
    }

    function updateScrollbarThumb(layout) {
      const sb = d3.select("#horizon-chart-inner .horizon-hscroll");
      if (sb.empty() || !layout || layout.scrollMax <= 0) return;
      const thumbW = Math.max(28, (layout.plotW * layout.plotW) / (layout.plotW + layout.scrollMax));
      const travel = Math.max(1, layout.plotW - thumbW);
      const thumbX = (timelineScrollX / layout.scrollMax) * travel;
      sb.select(".thumb").attr("x", thumbX).attr("width", thumbW);
    }

    function setTimelineScroll(x, layout, { fromUser = false } = {}) {
      if (!layout) return;
      const max = layout.scrollMax;
      timelineScrollX = Math.max(0, Math.min(max, x));
      if (fromUser) followLiveEdge = timelineScrollX >= max - SCROLL_EDGE_EPS;
      applyTimelineScrollPan();
      updateScrollbarThumb(layout);
    }

    function stickToLiveEdge(layout) {
      if (!followLiveEdge || !layout) return;
      setTimelineScroll(layout.scrollMax, layout);
    }

    function drawInternalScrollbar(svg, layout) {
      svg.selectAll(".horizon-hscroll").remove();
      if (!layout || layout.scrollMax <= 0) return;

      const y = Math.min(layout.svgH - SCROLLBAR_H - 4, layout.chartBottom + 6);
      const sb = svg
        .append("g")
        .attr("class", "horizon-hscroll")
        .attr("transform", `translate(${GUTTER},${y})`);

      sb.append("rect")
        .attr("class", "track")
        .attr("width", layout.plotW)
        .attr("height", SCROLLBAR_H)
        .attr("rx", SCROLLBAR_H / 2)
        .attr("fill", "#18181b")
        .attr("stroke", "#27272a")
        .on("click", (event) => {
          const [mx] = d3.pointer(event, sb.select(".track").node());
          const ratio = mx / layout.plotW;
          setTimelineScroll(ratio * layout.scrollMax, layout, { fromUser: true });
        });

      const thumbW = Math.max(28, (layout.plotW * layout.plotW) / (layout.plotW + layout.scrollMax));
      sb.append("rect")
        .attr("class", "thumb")
        .attr("y", 1)
        .attr("height", SCROLLBAR_H - 2)
        .attr("rx", (SCROLLBAR_H - 2) / 2)
        .call(
          d3
            .drag()
            .on("start", () => {
              followLiveEdge = false;
            })
            .on("drag", (event) => {
              const track = sb.select(".track").node();
              const [mx] = d3.pointer(event, track);
              const thumbWNow = parseFloat(sb.select(".thumb").attr("width")) || thumbW;
              const travel = Math.max(1, layout.plotW - thumbWNow);
              const ratio = Math.max(0, Math.min(1, (mx - thumbWNow / 2) / travel));
              setTimelineScroll(ratio * layout.scrollMax, layout, { fromUser: true });
            })
        );

      updateScrollbarThumb(layout);
    }

    function createHorizonSvg(viewport, inner, layout) {
      inner.innerHTML = "";
      inner.style.width = "";
      const svg = d3
        .select(inner)
        .append("svg")
        .attr("width", layout.cw)
        .attr("height", layout.svgH);

      svg.select(`#${CLIP_ID}`).remove();
      svg
        .append("defs")
        .append("clipPath")
        .attr("id", CLIP_ID)
        .append("rect")
        .attr("x", GUTTER)
        .attr("y", 0)
        .attr("width", layout.plotW)
        .attr("height", layout.chartBottom);

      const plotG = svg.append("g").attr("clip-path", `url(#${CLIP_ID})`);
      const scrollPan = plotG.append("g").attr("class", "horizon-scroll-pan");
      const zoomG = scrollPan.append("g").attr("class", "horizon-timeline-scroll");
      const g = zoomG.append("g");
      const labelsG = svg.append("g").attr("class", "horizon-labels");

      return { svg, labelsG, g, zoomG, scrollPan };
    }

    /** Fixed SVG width; pan/zoom on clipped timeline only. */
    function applyHorizonView(svg, zoomG, viewport, layout, savedTransform) {
      const viewportEl = document.getElementById("horizon-viewport");
      viewportEl?.classList.add("is-panning");
      zoomHost.bind(svg, zoomG, viewport);
      const behavior = zoomHost.getBehavior();
      if (behavior) {
        behavior.filter((event) => {
          if (event.type === "wheel") {
            const horizontal =
              Math.abs(event.deltaX) > Math.abs(event.deltaY) || event.shiftKey;
            if (horizontal) return false;
          }
          return (!event.ctrlKey && event.button === 0) || event.type === "wheel";
        });
      }
      const t = savedTransform || zoomHost.getTransform();
      const userZoomed = t.k !== 1 || Math.abs(t.x) > 0.5 || Math.abs(t.y) > 0.5;
      if (!horizonViewReady || !userZoomed) {
        zoomHost.resetTo100();
        horizonViewReady = true;
      } else {
        svg.call(zoomHost.getBehavior().transform, t);
      }
      applyTimelineScrollPan();
      drawInternalScrollbar(svg, layout);
      requestAnimationFrame(() => stickToLiveEdge(layout));
    }

    function normPath(p) {
      return (p || "").replace(/\\/g, "/");
    }

    function timelineEnd() {
      if (promptPhase === "frozen" && promptEndAt != null) return promptEndAt;
      if (promptPhase === "running") return Date.now();
      return Date.now();
    }

    function timeRange() {
      if (promptStartAt == null) return null;
      const end = timelineEnd();
      let start = promptStartAt;
      if (end - start < MIN_PROMPT_SPAN_MS) {
        start = end - MIN_PROMPT_SPAN_MS;
      }
      return [start, end];
    }

    function updatePromptStatus() {
      const el = document.getElementById("status-prompt");
      if (promptPhase === "idle") {
        el.innerHTML =
          '<i class="fa-solid fa-hourglass-half fa-icon-sm" aria-hidden="true"></i> Waiting for prompt…';
        el.className = "text-xs text-zinc-500 inline-flex items-center gap-1.5 truncate max-w-[14rem]";
        return;
      }
      if (promptPhase === "running") {
        el.innerHTML =
          '<i class="fa-solid fa-bolt fa-icon-sm" aria-hidden="true"></i> Prompt running — timeline live';
        el.className = "text-xs text-violet-300 inline-flex items-center gap-1.5 truncate max-w-[14rem]";
        return;
      }
      el.innerHTML =
        '<i class="fa-solid fa-snowflake fa-icon-sm" aria-hidden="true"></i> Prompt complete — timeline frozen';
      el.className = "text-xs text-sky-400 inline-flex items-center gap-1.5 truncate max-w-[14rem]";
    }

    function adoptResetSeq(seq) {
      if (seq == null) return;
      monitorResetSeq = Math.max(monitorResetSeq, seq);
    }

    function isStaleReset(seq) {
      return seq != null && seq < monitorResetSeq;
    }

    function beginPrompt(at) {
      events.length = 0;
      fileMeta.clear();
      promptStartAt = at ?? Date.now();
      promptEndAt = null;
      promptPhase = "running";
      lastActivityAt = null;
      timelineScrollX = 0;
      followLiveEdge = true;
      updatePromptStatus();
      render();
    }

    function resetForNewPrompt(data = {}) {
      adoptResetSeq(data.resetSeq);
      beginPrompt(data.at ?? Date.now());
    }

    function endPrompt(at) {
      if (promptPhase !== "running" || promptStartAt == null) return;
      promptEndAt = at ?? Date.now();
      if (promptEndAt < promptStartAt) promptEndAt = promptStartAt + 1;
      promptPhase = "frozen";
      updatePromptStatus();
      render();
    }

    function pruneEvents() {
      const range = timeRange();
      if (!range) return;
      const [t0, t1] = range;
      while (events.length && events[0].at < t0) events.shift();
      while (events.length && events[events.length - 1].at > t1) events.pop();
    }

    function ingestEvent(ev, { replay = false } = {}) {
      if (isStaleReset(ev.resetSeq)) return;
      adoptResetSeq(ev.resetSeq);

      const path = normPath(ev.path);
      if (!path) return;
      const at = ev.at || Date.now();

      if (promptPhase === "idle") {
        beginPrompt(at);
      }

      if (promptPhase === "frozen" && !replay) {
        // Same prompt still running after a premature idle (keep data).
        if (promptEndAt != null && at <= promptEndAt + UNFREEZE_GRACE_MS) {
          promptPhase = "running";
          promptEndAt = null;
          updatePromptStatus();
        } else {
          // New prompt / new work — clear prior reads, writes, greps, etc.
          beginPrompt(at);
        }
      }

      if (promptStartAt != null && at < promptStartAt) return;
      const action = ev.action || "read";
      const dir =
        ev.dir != null
          ? normPath(ev.dir)
          : path.includes("/")
            ? path.slice(0, path.lastIndexOf("/"))
            : "";
      const name = ev.name || path.split("/").pop() || path;
      events.push({ path, dir, name, action, at });
      fileMeta.set(path, { dir, name, lastAt: at });
      while (events.length > 800) events.shift();
      const paths = [...fileMeta.entries()].sort((a, b) => b[1].lastAt - a[1].lastAt);
      if (paths.length > MAX_FILES) {
        const drop = new Set(paths.slice(MAX_FILES).map(([p]) => p));
        for (let i = events.length - 1; i >= 0; i--) {
          if (drop.has(events[i].path)) events.splice(i, 1);
        }
        for (const p of drop) fileMeta.delete(p);
      }

      lastActivityAt = at;
    }

    function buildRows() {
      const byDir = new Map();
      for (const [path, meta] of fileMeta) {
        const dir = meta.dir || "";
        if (!byDir.has(dir)) byDir.set(dir, []);
        byDir.get(dir).push({ path, name: meta.name, lastAt: meta.lastAt });
      }
      const dirs = [...byDir.keys()].sort((a, b) => {
        const la = Math.max(...byDir.get(a).map((f) => f.lastAt));
        const lb = Math.max(...byDir.get(b).map((f) => f.lastAt));
        return lb - la;
      });
      const rows = [];
      for (const dir of dirs) {
        const files = byDir.get(dir).sort((a, b) => b.lastAt - a.lastAt);
        rows.push({ type: "dir", key: `dir:${dir}`, label: dir ? `${dir}/` : "(root)/", dir });
        for (const f of files) {
          rows.push({ type: "file", key: f.path, path: f.path, label: f.name, dir });
        }
      }
      return rows;
    }

    function binsForFile(path, t0, t1) {
      const n = Math.max(1, Math.ceil((t1 - t0) / BUCKET_MS));
      const bins = Array.from({ length: n }, () => ({}));
      for (const ev of events) {
        if (ev.path !== path) continue;
        const idx = Math.floor((ev.at - t0) / BUCKET_MS);
        if (idx < 0 || idx >= n) continue;
        bins[idx][ev.action] = (bins[idx][ev.action] || 0) + 1;
      }
      return bins;
    }

    function drawHorizonRow(g, rowY, rowH, path, x, t0, t1) {
      const bins = binsForFile(path, t0, t1);
      const mid = rowY + rowH / 2;
      const h = rowH / 2 - 1;
      const bw = Math.max(1, x(t0 + BUCKET_MS) - x(t0) - 0.5);

      bins.forEach((counts, i) => {
        const actions = Object.entries(counts);
        if (!actions.length) return;
        const bx = x(t0 + i * BUCKET_MS);
        let stack = 0;
        for (const [action, count] of actions) {
          const color = ACTION_COLORS[action] || "#6366f1";
          const intensity = Math.min(1, 0.35 + count * 0.25);
          const bh = (h * intensity) / actions.length;
          g.append("rect")
            .attr("x", bx)
            .attr("y", mid - stack - bh)
            .attr("width", bw)
            .attr("height", bh)
            .attr("fill", color)
            .attr("opacity", 0.85);
          g.append("rect")
            .attr("x", bx)
            .attr("y", mid + stack)
            .attr("width", bw)
            .attr("height", bh)
            .attr("fill", color)
            .attr("opacity", 0.55);
          stack += bh;
        }
      });
    }

    function drawEmptyFileRow(g, rowY, rowH, x, t0, t1) {
      const mid = rowY + rowH / 2;
      g.append("line")
        .attr("x1", GUTTER)
        .attr("x2", x(t1))
        .attr("y1", mid)
        .attr("y2", mid)
        .attr("stroke", "#27272a")
        .attr("stroke-width", 1);
      const n = Math.max(1, Math.ceil((t1 - t0) / BUCKET_MS));
      const bw = Math.max(1, x(t0 + BUCKET_MS) - x(t0) - 0.5);
      for (let i = 0; i < n; i += 4) {
        g.append("rect")
          .attr("x", x(t0 + i * BUCKET_MS))
          .attr("y", mid - 2)
          .attr("width", bw)
          .attr("height", 4)
          .attr("fill", "#27272a")
          .attr("opacity", 0.35);
      }
    }

    function renderPlaceholderChart(viewport, inner, savedTransform) {
      const now = Date.now();
      const t0 = now - MIN_PROMPT_SPAN_MS;
      const t1 = now;
      const rows = PLACEHOLDER_ROWS;
      const layout = computeLayout(viewport, rows, t0, t1);
      currentLayout = layout;
      const { svg, labelsG, g, zoomG } = createHorizonSvg(viewport, inner, layout);
      const { x, chartW, chartBottom, cw } = layout;

      g.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${MARGIN_TOP - 8})`)
        .call(d3.axisTop(x).ticks(6).tickFormat(d3.timeFormat("%H:%M:%S")));

      g.append("text")
        .attr("class", "placeholder-hint")
        .attr("x", GUTTER + chartW / 2)
        .attr("y", MARGIN_TOP + 14)
        .attr("text-anchor", "middle")
        .text("Waiting for a new prompt. Activity for each prompt is shown from start to complete.");

      g.append("line")
        .attr("class", "prompt-marker prompt-start")
        .attr("x1", x(t0))
        .attr("x2", x(t0))
        .attr("y1", MARGIN_TOP)
        .attr("y2", chartBottom)
        .attr("stroke", "#3f3f46")
        .attr("stroke-width", 1.5)
        .attr("stroke-dasharray", "4 4")
        .attr("opacity", 0.6);

      let y = MARGIN_TOP + Math.round(22 * SCALE);
      for (const row of rows) {
        const rh = row.type === "dir" ? DIR_ROW_H : ROW_H;
        labelsG
          .append("text")
          .attr("class", row.type === "dir" ? "placeholder-dir" : "placeholder-file")
          .attr("x", row.type === "dir" ? 8 : 20)
          .attr("y", y + rh / 2)
          .attr("dominant-baseline", "middle")
          .attr("font-size", row.type === "dir" ? Math.round(11 * SCALE) : Math.round(10 * SCALE))
          .attr("font-family", "ui-monospace, monospace")
          .text(row.label);

        if (row.type === "file") {
          drawEmptyFileRow(g, y, rh, x, t0, t1);
        } else {
          labelsG
            .append("rect")
            .attr("x", 0)
            .attr("y", y)
            .attr("width", GUTTER)
            .attr("height", rh)
            .attr("fill", "#18181b")
            .attr("opacity", 0.35);
          g.append("rect")
            .attr("x", GUTTER)
            .attr("y", y)
            .attr("width", chartW + MARGIN_RIGHT)
            .attr("height", rh)
            .attr("fill", "#18181b")
            .attr("opacity", 0.35);
        }
        y += rh;
      }

      document.getElementById("status-stats").textContent = "—";

      applyHorizonView(svg, zoomG, viewport, layout, savedTransform);
    }

    function drawPromptMarker(g, x, time, yTop, yBottom, kind) {
      if (time == null) return;
      const px = x(time);
      const isStart = kind === "start";
      const stroke = isStart ? "#a78bfa" : "#38bdf8";
      g.append("line")
        .attr("class", `prompt-marker prompt-${kind}`)
        .attr("x1", px)
        .attr("x2", px)
        .attr("y1", yTop)
        .attr("y2", yBottom)
        .attr("stroke", stroke)
        .attr("stroke-width", 2)
        .attr("opacity", 0.95);
      g.append("text")
        .attr("class", "prompt-marker-label")
        .attr("x", px + 4)
        .attr("y", yTop + 10)
        .attr("fill", stroke)
        .text(isStart ? "Prompt start" : "Prompt complete");
    }

    function render() {
      if (promptPhase !== "idle") pruneEvents();

      const viewport = document.getElementById("horizon-viewport");
      const inner = document.getElementById("horizon-chart-inner");
      const range = timeRange();
      const existingSvg = inner.querySelector("svg");
      const savedTransform = existingSvg
        ? d3.zoomTransform(existingSvg)
        : zoomHost.getTransform();

      inner.innerHTML = "";

      if (promptPhase === "idle" || !range) {
        renderPlaceholderChart(viewport, inner, savedTransform);
        return;
      }

      const rows = buildRows();
      const [t0, t1] = range;
      const layout = computeLayout(viewport, rows, t0, t1);
      currentLayout = layout;
      const { svg, labelsG, g, zoomG } = createHorizonSvg(viewport, inner, layout);
      const { x, chartW, chartBottom, cw } = layout;

      g.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${MARGIN_TOP - 8})`)
        .call(d3.axisTop(x).ticks(6).tickFormat(d3.timeFormat("%H:%M:%S")));

      drawPromptMarker(g, x, promptStartAt, MARGIN_TOP, chartBottom, "start");
      if (promptPhase === "frozen" && promptEndAt != null) {
        drawPromptMarker(g, x, promptEndAt, MARGIN_TOP, chartBottom, "end");
      }

      let y = MARGIN_TOP;
      if (!rows.length) {
        g.append("text")
          .attr("x", GUTTER + chartW / 2)
          .attr("y", y + 24)
          .attr("text-anchor", "middle")
          .attr("fill", "#71717a")
          .attr("font-size", Math.round(12 * SCALE))
          .text("No file activity yet for this prompt.");
      }

      for (const row of rows) {
        const rh = row.type === "dir" ? DIR_ROW_H : ROW_H;
        labelsG
          .append("text")
          .attr("class", row.type === "dir" ? "dir-label" : "file-label")
          .attr("x", row.type === "dir" ? 8 : 20)
          .attr("y", y + rh / 2)
          .attr("dominant-baseline", "middle")
          .attr("font-size", row.type === "dir" ? Math.round(11 * SCALE) : Math.round(10 * SCALE))
          .attr("font-family", "ui-monospace, monospace")
          .text(() => {
            const max = row.type === "dir" ? 28 : 24;
            return row.label.length > max ? row.label.slice(0, max - 1) + "…" : row.label;
          });

        if (row.type === "file") {
          g.append("line")
            .attr("x1", GUTTER)
            .attr("x2", GUTTER + chartW)
            .attr("y1", y + rh / 2)
            .attr("y2", y + rh / 2)
            .attr("stroke", "#27272a")
            .attr("stroke-width", 1);
          drawHorizonRow(g, y, rh, row.path, x, t0, t1);
          labelsG
            .append("rect")
            .attr("class", "file-row-hit")
            .attr("x", 0)
            .attr("y", y)
            .attr("width", cw)
            .attr("height", rh)
            .on("click", (event) => {
              event.stopPropagation();
              openPreview(row.path, row.label);
            });
        } else {
          labelsG
            .append("rect")
            .attr("x", 0)
            .attr("y", y)
            .attr("width", GUTTER)
            .attr("height", rh)
            .attr("fill", "#18181b")
            .attr("opacity", 0.5);
          g.append("rect")
            .attr("x", GUTTER)
            .attr("y", y)
            .attr("width", chartW + MARGIN_RIGHT)
            .attr("height", rh)
            .attr("fill", "#18181b")
            .attr("opacity", 0.5);
        }
        y += rh;
      }

      const durSec = Math.round((t1 - t0) / 1000);
      const phaseLabel = promptPhase === "frozen" ? "frozen" : "live";
      document.getElementById("status-stats").textContent =
        `${events.length} events · ${fileMeta.size} files · ${durSec}s · ${phaseLabel}`;

      applyHorizonView(svg, zoomG, viewport, layout, savedTransform);
    }

    function handleAgentStatus(data) {
      const phase = data.phase;
      const at = data.at ?? Date.now();
      if (phase === "prompt_submitted") {
        try {
          window.parent?.postMessage(
            {
              source: "AICodeEditorMonitor",
              type: "prompt-submitted",
              payload: { prompt: data.prompt, resetSeq: data.resetSeq },
            },
            "*"
          );
        } catch {}
        resetForNewPrompt(data);
        return;
      }
    }

    function notifyParentSessionReset(resetSeq) {
      try {
        window.parent?.postMessage(
          {
            source: "AICodeEditorMonitor",
            type: "session-reset",
            payload: { resetSeq },
          },
          "*"
        );
      } catch {}
    }

    function applyMessage(data) {
      if (data.type === "agent_status") {
        handleAgentStatus(data);
        return;
      }

      if (data.type === "activity_event") {
        ingestEvent(data);
        render();
        return;
      }

      if (data.type === "activity_batch" && Array.isArray(data.events)) {
        const evs = data.events.filter(
          (ev) => normPath(ev.path) && !isStaleReset(ev.resetSeq)
        );
        if (!evs.length) return;
        if (promptPhase === "idle") {
          const minAt = Math.min(...evs.map((ev) => ev.at || Date.now()));
          beginPrompt(minAt);
        }
        const replay = promptPhase === "frozen";
        for (const ev of evs) ingestEvent(ev, { replay });
        if (replay && evs.length) {
          const maxAt = Math.max(...evs.map((ev) => ev.at || Date.now()));
          if (promptEndAt == null || maxAt > promptEndAt) {
            promptEndAt = maxAt;
          }
        }
        render();
        return;
      }

      if (data.type === "session_reset") {
        notifyParentSessionReset(data.resetSeq);
        resetForNewPrompt(data);
        return;
      }

      if (data.type === "monitor_settings") {
        if (typeof data.horizonTimelineScale === "number") {
          timelineScale = data.horizonTimelineScale;
          const slider = document.getElementById("horizon-timeline-scale");
          if (slider) slider.value = String(timelineScale);
          render();
        }
        return;
      }

      if (data.type === "status") {
        if (data.status === "plugin_connected") setBadge("status-plugin", "Plugin: connected", "ok");
        if (data.status === "plugin_waiting") setBadge("status-plugin", "Plugin: no server", "warn");
        if (data.status === "session_idle" && promptPhase === "running") {
          try {
            window.parent?.postMessage(
              {
                source: "AICodeEditorMonitor",
                type: "prompt-complete",
                payload: { summary: data.summary ?? null },
              },
              "*"
            );
          } catch {}
          endPrompt(data.at ?? Date.now());
        }
      }
    }

    updatePromptStatus();
    attachZoomControls(document.getElementById("horizon-zoom-toolbar"), zoomHost, {
      hint: "Drag chart to pan/zoom · scrollbar scrolls timeline",
    });
    initPreview();

    const timelineSlider = document.getElementById("horizon-timeline-scale");
    const viewportEl = document.getElementById("horizon-viewport");

    viewportEl?.addEventListener(
      "wheel",
      (event) => {
        if (!currentLayout || currentLayout.scrollMax <= 0) return;
        const horizontal = Math.abs(event.deltaX) > Math.abs(event.deltaY) || event.shiftKey;
        if (!horizontal) return;
        event.preventDefault();
        const delta = event.deltaX !== 0 ? event.deltaX : event.deltaY;
        setTimelineScroll(timelineScrollX + delta, currentLayout, { fromUser: true });
      },
      { passive: false }
    );

    async function loadMonitorSettings() {
      try {
        const res = await fetch("/api/settings");
        if (!res.ok) return;
        const data = await res.json();
        if (typeof data.horizonTimelineScale === "number") {
          timelineScale = data.horizonTimelineScale;
          if (timelineSlider) timelineSlider.value = String(timelineScale);
        }
      } catch {}
    }

    function scheduleSaveTimelineScale() {
      clearTimeout(saveTimelineTimer);
      saveTimelineTimer = setTimeout(async () => {
        try {
          await fetch("/api/settings", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ horizonTimelineScale: timelineScale }),
          });
        } catch {}
      }, 400);
    }

    timelineSlider?.addEventListener("input", () => {
      timelineScale = parseFloat(timelineSlider.value) || 1;
      render();
      scheduleSaveTimelineScale();
    });

    const ws = new WebSocket(`ws://${location.hostname}:8765`);
    ws.onopen = () => setBadge("status-browser", "Browser: connected", "ok");
    ws.onclose = () => setBadge("status-browser", "Browser: disconnected", "bad");
    ws.onerror = () => setBadge("status-browser", "Browser: error", "bad");
    ws.onmessage = (e) => applyMessage(JSON.parse(e.data));

    setInterval(() => {
      if (promptPhase === "running") render();
    }, 1000);

    window.addEventListener("resize", () => render());
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) render();
    });
    loadMonitorSettings().then(() => render());
  </script>
</body>
</html>
